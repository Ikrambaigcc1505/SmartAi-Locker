name: Android CI Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle & cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystores
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          base64 --decode "${{ github.workspace }}/debug.keystore.base64" > "${{ github.workspace }}/debug.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n' | base64 --decode > "${{ github.workspace }}/release-keystore.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests and build APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Debug & Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: smartai-locker-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: smartai-locker-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
